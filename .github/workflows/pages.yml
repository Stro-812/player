# Сайт книги «Не про бег» на GitHub Pages: папка book-site/ как есть, без сборки.
# Метка __SITE_URL__ заменяется на адрес Pages при выкладке; в репозитории она остаётся,
# чтобы тот же сайт можно было выложить на поддомен с другим адресом.
name: Сайт книги (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://stro-812.github.io/player

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подставить адрес сайта
        run: |
          mkdir _site
          cp -r book-site/. _site/
          rm -rf _site/README.md _site/tools   # служебное, на сайт не нужно
          grep -rl '__SITE_URL__' _site | xargs sed -i "s#__SITE_URL__#${SITE_URL}#g"
          ! grep -rn '__SITE_URL__\|__OWNER_EMAIL__' _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
